# Local runbook: from the repository root,
#   cp -n .env.example .env
#   docker compose -f deploy/compose.yml --env-file .env up --build
#
# This file does not deploy anywhere public.

name: alloy-net

services:
  net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: alloy-ts-net:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: ../.env
        required: false
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:'+(process.env.PORT||3000)+'/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
