# Local runbook: from the repository root,
#   cp -n .env.example .env
#   docker compose -f deploy/compose.yml --env-file .env up --build
#
# This file does not deploy anywhere public.

name: alloy-net

services:
  net:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-2}
    image: alloy-ts-net:local
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    mem_limit: 768m
    ports:
      - "127.0.0.1:${PORT:-3000}:${PORT:-3000}"
    env_file:
      - path: ../.env
        required: false
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
