# Shared toolchain setup: Node, npm cache, Rust (+ an extra rustup target).
parameters:
  - name: target
    type: string
    default: ""

steps:
  - task: NodeTool@0
    displayName: Node $(NODE_VERSION)
    inputs:
      versionSpec: $(NODE_VERSION)
  - task: Cache@2
    displayName: npm cache
    inputs:
      key: npm | "$(Agent.OS)" | package-lock.json
      restoreKeys: npm | "$(Agent.OS)"
      path: $(NPM_CONFIG_CACHE)
  - bash: |
      set -euo pipefail
      if ! command -v rustup >/dev/null; then
        curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal
        echo "##vso[task.prependpath]$HOME/.cargo/bin"
        export PATH="$HOME/.cargo/bin:$PATH"
      fi
      rustup toolchain install stable --profile minimal --component clippy,rustfmt
      rustup default stable
      if [ -n "${{ parameters.target }}" ]; then rustup target add "${{ parameters.target }}"; fi
      rustc -vV
    displayName: Rust toolchain ${{ parameters.target }}
