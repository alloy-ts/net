# rocket 0.5.2 -> ref-swap 0.1.3 calls AtomicPtr::try_update, which only became
# stable in Rust 1.95. The lower bound is declared as `rust-version = "1.95.0"`
# in Cargo.toml, so an older compiler fails with a clear message instead of an
# obscure error inside ref-swap.
#
# Keep the toolchain on the fully installed `stable` channel (1.100.0 here).
# Naming an exact version such as `1.100.0` makes rustup treat it as a channel
# to sync; on a partially installed toolchain that triggers a full component
# re-download and stalls builds in this environment.
[toolchain]
channel = "stable"
